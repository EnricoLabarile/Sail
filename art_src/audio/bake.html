<!doctype html>
<meta charset="utf-8">
<title>Bake the game's sounds</title>
<!--
  BAKE SOUNDS: makes the game's sound files from the HTML prototype's own sound code (Sail---Prototype,
  index.html, the Sfx section), rendered offline in a browser (an OfflineAudioContext: the Web Audio graph is
  played into memory, not to the speakers). bake.py opens this page in a headless Chromium, calls bake(name)
  for each sound and saves the WAVs, then turns them into .ogg for Godot.
  The anchor's functions (chainLink, anchor) and the noise maker (colouredNoise) are copied VERBATIM from the
  prototype. The sea and the water along the hull follow its ambient() (the per-frame changes written out
  ahead as a timeline). The wind is new: the prototype had no wind sound. (Sea, wind and hull water are no longer
  used by the game, Enrico; they stay here in case they come back.)
  The ship's wheel: thunk() (the thud at full lock) is copied verbatim, the rub is its looping layer from init().
  The slingshot: thunk() again, and splash() (verbatim) for the stone landing in the water.
-->
<script>
let ac = null, master = null, noise = null;
const AMB_LEVEL = 0.1;   // the prototype's ambience level (its AMB_LEVEL)

// A fresh offline context of the given length, with the prototype's master gain (0.9) and white noise.
function fresh(seconds, channels, rate){
  ac = new OfflineAudioContext(channels, Math.ceil(seconds * rate), rate);
  master = ac.createGain(); master.gain.value = 0.9; master.connect(ac.destination);
  noise = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
  const ch = noise.getChannelData(0);
  for(let i = 0; i < ch.length; i++) ch[i] = Math.random()*2 - 1;
}

// ---- copied from the prototype ----
    function colouredNoise(kind){
      const n = ac.sampleRate*6, buf = ac.createBuffer(1, n, ac.sampleRate), d = buf.getChannelData(0);
      let b0=0,b1=0,b2=0,b3=0,b4=0,b5=0,b6=0,last=0,peak=0;
      for(let i=0;i<n;i++){
        const w = Math.random()*2-1;
        let v;
        if(kind==='brown'){ last = (last + 0.02*w)/1.02; v = last; }
        else {
          b0=0.99886*b0+w*0.0555179; b1=0.99332*b1+w*0.0750759; b2=0.969*b2+w*0.153852;
          b3=0.8665*b3+w*0.3104856; b4=0.55*b4+w*0.5329522; b5=-0.7616*b5-w*0.016898;
          v=b0+b1+b2+b3+b4+b5+b6+w*0.5362; b6=w*0.115926;
        }
        d[i]=v; if(Math.abs(v)>peak) peak=Math.abs(v);
      }
      // crossfade the ends so the loop point is seamless
      const xf = Math.floor(ac.sampleRate*0.25);
      for(let i=0;i<xf;i++){ const k=i/xf; d[i] = d[i]*k + d[n-xf+i]*(1-k); }
      for(let i=0;i<n;i++) d[i] /= peak;
      return buf;
    }

    function chainLink(at, pitch, k){
      const src = ac.createBufferSource(); src.buffer = noise;
      const bp = ac.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value = (1900 + Math.random()*900)*pitch; bp.Q.value = 2.5;
      const g = ac.createGain(); g.gain.setValueAtTime(0.0001, at); g.gain.exponentialRampToValueAtTime(0.07*k, at+0.002); g.gain.exponentialRampToValueAtTime(0.0001, at+0.035);
      src.connect(bp); bp.connect(g); g.connect(master); src.start(at, Math.random()*0.8, 0.04);
      const o = ac.createOscillator(); o.type='triangle'; o.frequency.value = (900 + Math.random()*400)*pitch;
      const og = ac.createGain(); og.gain.setValueAtTime(0.0001, at); og.gain.exponentialRampToValueAtTime(0.025*k, at+0.002); og.gain.exponentialRampToValueAtTime(0.0001, at+0.03);
      o.connect(og); og.connect(master); o.start(at); o.stop(at+0.04);
    }

    function anchor(down){
      // (the prototype's check that the audio is running is left out: here it renders offline)
      const t0 = ac.currentTime + 0.01;
      if(down){
        // a quick, low thud as the anchor hits the water…
        const o = ac.createOscillator(); o.type='sine';
        o.frequency.setValueAtTime(37.5, t0); o.frequency.exponentialRampToValueAtTime(21, t0+0.12);
        const og = ac.createGain(); og.gain.setValueAtTime(0.0001, t0); og.gain.exponentialRampToValueAtTime(0.3, t0+0.006); og.gain.exponentialRampToValueAtTime(0.0001, t0+0.18);
        o.connect(og); og.connect(master); o.start(t0); o.stop(t0+0.2);
        // …then the water follows through: a wet body of splash…
        const at = t0 + 0.02;
        const s1 = ac.createBufferSource(); s1.buffer = noise;
        const lp = ac.createBiquadFilter(); lp.type='lowpass'; lp.frequency.setValueAtTime(900, at); lp.frequency.exponentialRampToValueAtTime(110, at+1.3);
        const g = ac.createGain(); g.gain.setValueAtTime(0.0001, at); g.gain.exponentialRampToValueAtTime(0.16, at+0.06); g.gain.exponentialRampToValueAtTime(0.0001, at+1.4);
        s1.connect(lp); lp.connect(g); g.connect(master); s1.start(at, Math.random()*0.2, 1.45);
        // …spray falling back…
        const s2 = ac.createBufferSource(); s2.buffer = noise;
        const bp = ac.createBiquadFilter(); bp.type='bandpass'; bp.frequency.setValueAtTime(1600, at+0.05); bp.frequency.exponentialRampToValueAtTime(700, at+0.7); bp.Q.value = 0.8;
        const g2 = ac.createGain(); g2.gain.setValueAtTime(0.0001, at+0.04); g2.gain.exponentialRampToValueAtTime(0.06, at+0.12); g2.gain.exponentialRampToValueAtTime(0.0001, at+0.8);
        s2.connect(bp); bp.connect(g2); g2.connect(master); s2.start(at+0.04, Math.random()*0.5, 0.8);
        // …and the gulp and bubbles as it goes under
        for(let k=0;k<5;k++){
          const bt = at + 0.45 + k*0.13 + Math.random()*0.06;
          const bo = ac.createOscillator(); bo.frequency.setValueAtTime(90+Math.random()*100, bt); bo.frequency.exponentialRampToValueAtTime(190+Math.random()*60, bt+0.06);
          const bgn = ac.createGain(); bgn.gain.setValueAtTime(0.0001, bt); bgn.gain.exponentialRampToValueAtTime(0.025, bt+0.01); bgn.gain.exponentialRampToValueAtTime(0.0001, bt+0.07);
          bo.connect(bgn); bgn.connect(master); bo.start(bt); bo.stop(bt+0.08);
        }
      } else {
        // weighing anchor: the chain rattling in, link by link, bright and
        // quick, finishing within the WEIGH_TIME the boat waits
        const n = 12;
        for(let k=0;k<n;k++) chainLink(t0 + k*0.066 + Math.random()*0.012, 0.5, 2.4);   // an octave lower than it was (the old pitch is the crank's), and louder: low it got lost
        { // under the links, the chain running in through the hawse: a low rumble for the whole haul
          const sr = ac.createBufferSource(); sr.buffer = noise;
          const lp = ac.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value = 380;
          const g = ac.createGain(); g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(0.12, t0+0.08); g.gain.setValueAtTime(0.12, t0+n*0.066-0.1); g.gain.exponentialRampToValueAtTime(0.0001, t0+n*0.066+0.05);
          sr.connect(lp); lp.connect(g); g.connect(master); sr.start(t0, Math.random()*0.5, n*0.066+0.1);
        }
        // the last link clunks home
        const end = t0 + n*0.066;
        const o = ac.createOscillator(); o.frequency.setValueAtTime(260, end); o.frequency.exponentialRampToValueAtTime(150, end+0.06);
        const og = ac.createGain(); og.gain.setValueAtTime(0.0001, end); og.gain.exponentialRampToValueAtTime(0.08, end+0.004); og.gain.exponentialRampToValueAtTime(0.0001, end+0.09);
        o.connect(og); og.connect(master); o.start(end); o.stop(end+0.1);
      }
    }

    // the ship's wheel (the prototype's init() and thunk()): its sounds all go through wheelBus (0.6)
    function thunk(vol){
      // (the prototype's check that the audio is running is left out: here it renders offline)
      const t = ac.currentTime;
      const src = ac.createBufferSource(); src.buffer = noise;
      const lp = ac.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=500;
      const g = env(0.35*vol, 0.12);
      src.connect(lp); lp.connect(g); g.connect(wheelBus);
      src.start(t, Math.random()*0.8, 0.15);
      const o = ac.createOscillator(); o.type='sine';
      o.frequency.setValueAtTime(150, t);
      o.frequency.exponentialRampToValueAtTime(95, t+0.1);
      const og = env(0.2*vol, 0.14);
      o.connect(og); og.connect(wheelBus);
      o.start(t); o.stop(t+0.16);
    }
    // a stone landing in the water (the prototype's splash(); its running check left out, as for the anchor)
    function splash(){
      const t0 = ac.currentTime;
      const src = ac.createBufferSource(); src.buffer = noise;
      const bp = ac.createBiquadFilter(); bp.type='lowpass';
      bp.frequency.setValueAtTime(1800,t0); bp.frequency.exponentialRampToValueAtTime(350,t0+0.5);
      const g = ac.createGain();
      g.gain.setValueAtTime(0.0001,t0); g.gain.exponentialRampToValueAtTime(0.1,t0+0.03);
      g.gain.exponentialRampToValueAtTime(0.0001,t0+0.6);
      src.connect(bp); bp.connect(g); g.connect(master);
      src.start(t0, Math.random()*0.3, 0.65);
    }
    function env(peak, len){
      const g = ac.createGain(), t = ac.currentTime;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(peak, t+0.003);
      g.gain.exponentialRampToValueAtTime(0.0001, t+len);
      return g;
    }

// ---- end of the copied code ----

const WHEEL_VOL = 2;   // the prototype's loudness of the ship's wheel (its WHEEL_VOL)
let wheelBus = null;   // the wheel's own bus (0.6), as in the prototype's init()
function makeWheelBus(){ wheelBus = ac.createGain(); wheelBus.gain.value = 0.6; wheelBus.connect(master); }

// A looping layer as the prototype's ambient layers: noise -> filter -> gain -> (pan) -> out.
function layer(buf, type, freq, Q, pan, offset, out){
  const src = ac.createBufferSource(); src.buffer = buf; src.loop = true;
  const f = ac.createBiquadFilter(); f.type = type; f.frequency.value = freq; f.Q.value = Q;
  const g = ac.createGain(); g.gain.value = 0;
  src.connect(f); f.connect(g);
  if(pan !== 0){ const p = ac.createStereoPanner(); p.pan.value = pan; g.connect(p); p.connect(out); }
  else g.connect(out);
  src.start(0, offset);
  return {f, g};
}

// Writes a curve into a parameter ahead of time, a point every 1/20 s (what ambient() did every frame).
function curve(param, seconds, fn){
  const steps = Math.ceil(seconds * 20);
  for(let i = 0; i <= steps; i++){ const t = i / 20; param.linearRampToValueAtTime(fn(t), t); }
}

// A swell that rises and falls once a period, the periods in turn from a list that adds up to the loop's length
// (so the end meets the start). start: how far into the list it begins (0..1 of the first period).
function swell(periods, start){
  const total = periods.reduce((a, b) => a + b, 0);
  return (t) => {
    t = ((t + start * periods[0]) % total + total) % total;
    for(const p of periods){ if(t < p){ const ph = t / p; return 0.5 - 0.5*Math.cos(ph * Math.PI * 2); } t -= p; }
    return 0;
  };
}

const LOOP = 48;     // seconds every loop lasts (all the swells and gusts below repeat exactly in it)
const EXTRA = 1;     // a second more, cross-faded onto the start by bake.py so the loop has no seam

const SOUNDS = {
  // The sea: two slow swells of deep noise panned apart (ambient(): gain 0.35 + 0.65 sw², low-pass 220 + 330 sw).
  sea: { seconds: LOOP + EXTRA, channels: 2, rate: 22050, loop: true, build(){
    const amb = ac.createGain(); amb.gain.value = AMB_LEVEL; amb.connect(master);
    const brown = colouredNoise('brown');
    const a = layer(brown, 'lowpass', 380, 0.5, -0.55, 0, amb), b = layer(brown, 'lowpass', 380, 0.5, 0.55, 3.1, amb);
    const swA = swell([7, 8, 6.5, 9, 7.5, 10], 0), swB = swell([8.5, 6, 9.5, 7, 8, 9], 0.5);
    for(const [L, sw] of [[a, swA], [b, swB]]){
      curve(L.g.gain, LOOP + EXTRA, t => { const s = sw(t); return 0.35 + 0.65*s*s; });
      curve(L.f.frequency, LOOP + EXTRA, t => 220 + 330*sw(t));
    }
  }},
  // The water along the hull at full speed (ambient()'s rush with sf = 1: gain 0.2 × the lapping, low-pass 500).
  // The game turns it down and lower with her speed.
  rush: { seconds: LOOP + EXTRA, channels: 1, rate: 22050, loop: true, build(){
    const amb = ac.createGain(); amb.gain.value = AMB_LEVEL; amb.connect(master);
    const r = layer(colouredNoise('brown'), 'lowpass', 500, 0.5, 0, 2.2, amb);
    // the gentle, uneven lapping, with periods that fit the loop (8 s and 24 s)
    curve(r.g.gain, LOOP + EXTRA, t => 0.2 * (0.8 + 0.2*Math.sin(t * Math.PI*2/8) * Math.sin(t * Math.PI*2/24 + 1)));
  }},
  // The wind (new): soft pink noise round 600 Hz, in slow gusts that swell and brighten it.
  wind: { seconds: LOOP + EXTRA, channels: 1, rate: 22050, loop: true, build(){
    const amb = ac.createGain(); amb.gain.value = AMB_LEVEL * 0.6; amb.connect(master);
    const w = layer(colouredNoise('pink'), 'bandpass', 600, 0.7, 0, 1.3, amb);
    const gust = t => { const s = 0.5 + 0.3*Math.sin(t*Math.PI*2/16) + 0.2*Math.sin(t*Math.PI*2/6 + 2); return Math.max(0, Math.min(1, s)); };
    curve(w.g.gain, LOOP + EXTRA, t => 0.3 + 0.7*gust(t));
    curve(w.f.frequency, LOOP + EXTRA, t => 450 + 450*gust(t));
  }},
  // Dropping the anchor: a thud, the splash, the spray and the bubbles (the prototype's anchor(true)).
  anchor_down: { seconds: 2.2, channels: 1, rate: 44100, loop: false, build(){ anchor(true); } },
  // Weighing it: the chain rattling in link by link and the last one clunking home (anchor(false)).
  anchor_up: { seconds: 1.2, channels: 1, rate: 44100, loop: false, build(){ anchor(false); } },
  // The wheel's soft wooden rub while it turns (init()'s rub: dark low-passed noise), at full speed (k = 1: gain
  // 0.05 × WHEEL_VOL, low-pass 320 + 200). The game turns it down and lower as the wheel slows. A short loop.
  wheel_rub: { seconds: 6 + EXTRA, loopSeconds: 6, channels: 1, rate: 22050, loop: true, build(){
    makeWheelBus();
    const src = ac.createBufferSource(); src.buffer = noise; src.loop = true;
    const lp = ac.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value = 520; lp.Q.value = 0.7;
    const out = ac.createGain(); out.gain.value = 0.05 * WHEEL_VOL;
    src.connect(lp); lp.connect(out); out.connect(wheelBus);
    src.start();
  }},
  // The muted thud when the wheel hits full lock (thunk(WHEEL_VOL)); the game plays it softer when it's slow.
  wheel_thunk: { seconds: 0.3, channels: 1, rate: 44100, loop: false, build(){ makeWheelBus(); thunk(WHEEL_VOL); } },
  // The slingshot fired (the prototype's shootStone(): thunk(0.35)).
  sling_shot: { seconds: 0.3, channels: 1, rate: 44100, loop: false, build(){ makeWheelBus(); thunk(0.35); } },
  // A stone landing in the water (the prototype's updateSling(): splash() and thunk(0.25)).
  stone_splash: { seconds: 0.8, channels: 1, rate: 44100, loop: false, build(){ makeWheelBus(); splash(); thunk(0.25); } },
};

// Renders one sound and gives it back as a 32-bit float WAV, base64 (bake.py reads it).
async function bake(name){
  const s = SOUNDS[name];
  fresh(s.seconds, s.channels, s.rate);
  s.build();
  const buf = await ac.startRendering();
  const chans = []; for(let c = 0; c < buf.numberOfChannels; c++) chans.push(Array.from(buf.getChannelData(c)));
  return {rate: buf.sampleRate, loop: s.loop, loopSeconds: s.loop ? (s.loopSeconds || LOOP) : 0, chans};
}
</script>
